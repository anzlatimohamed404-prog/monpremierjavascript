<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date</title>
  <link rel="stylesheet" href="date.css">
</head>
<body>

  <h1>Heure,Date, et Mois*</h1>
  
  <div id="date">
    <p>
    <span id="annee"></span>
    </p>

    <p>
        <span id="mois"></span>
    </p>
  </div>

  <div id="date">
    <p>Date complet
        <span id="dateJour"></span>
    </p>

    <p>
        <span id="dateComplete"></span>
    </p>
  </div>

  <div class="horloge">
  <span id="heures">00</span> :
  <span id="minutes">00</span> :
  <span id="secondes">00</span>
</div>

<div class="horloge">
  <div class="ville">Heure actuelle à Paris 🇫🇷</div>
  <span id="heureParis">00:00:00</span>
  <div class="date" id="dateParis"></div>
</div>

<div class="horloge">
  <div class="ville">Heure actuelle à Tokyo 🇯🇵</div>
  <span id="heureTokyo">00:00:00</span>
  <div class="date" id="dateTokyo"></div>
</div>

</body>


<script src="manipulationDate.js" defer></script>
</html>
